<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پلنر هفتگی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#111118;
  --card:rgba(255,255,255,.025);
  --border:rgba(255,255,255,.05);
  --t1:#d0d0e0;
  --t2:#70708a;
  --t3:#404058;
  --purple:#b8a9c9;
  --blue:#a9c4d9;
  --green:#a9d4b8;
  --red:#f5b8c8;
  --pink:#d4a9d9;
  --orange:#f5d5a0;
  --r:14px;
  --rs:10px;
  --rx:8px;
}
html{font-size:16px;scroll-behavior:smooth}
body{
  font-family:'Vazirmatn',system-ui,sans-serif;
  background:var(--bg);color:var(--t1);
  min-height:100vh;direction:rtl;
  line-height:1.7;overflow-x:hidden;
  padding-bottom:60px;margin:0;
}
.wrap{max-width:460px;margin:0 auto;padding:20px}

.sec-title{font-size:.7rem;color:var(--t3);font-weight:500;margin-bottom:14px;letter-spacing:.03em}
.divider{height:1px;background:var(--border);margin:0 -20px 24px}

/* 1. Efficiency */
.eff{padding:24px 0 20px;text-align:center;margin-bottom:0}
.eff-ring{position:relative;width:130px;height:130px;margin:0 auto 14px}
.ring-svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:rgba(255,255,255,.035);stroke-width:5}
.ring-fg{fill:none;stroke:url(#rg);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 1.4s cubic-bezier(.4,0,.2,1)}
.eff-pct{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  font-size:2.2rem;font-weight:700;
  background:linear-gradient(135deg,#b8a9c9,#a9c4d9);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.eff-label{font-size:.78rem;color:var(--t3);font-weight:400}

/* 2. Focus */
.focus{display:flex;align-items:center;gap:10px;padding:14px 0;margin-bottom:0}
.focus-e{font-size:1rem}
.focus-inp{flex:1;background:none;border:none;outline:none;color:var(--t1);font-family:inherit;font-size:.88rem;font-weight:400;direction:rtl}
.focus-inp::placeholder{color:var(--t3)}

/* 3. Tubes */
.tubes{margin-bottom:0}
.tubes-row{display:flex;justify-content:space-between;align-items:flex-end;gap:4px;direction:ltr}
.tube-col{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1}
.tube-w{
  width:30px;height:84px;position:relative;border-radius:15px;
  overflow:hidden;background:rgba(255,255,255,.02);
  border:1px solid rgba(255,255,255,.04);
}
.tube-liq{
  position:absolute;bottom:0;left:0;right:0;
  border-radius:0 0 14px 14px;
  transition:height 1.2s cubic-bezier(.4,0,.2,1);overflow:hidden;
}
.tube-wave{position:absolute;top:-5px;left:-20%;width:140%;height:12px;animation:tw 2.5s ease-in-out infinite}
.tube-wave svg{width:100%;height:100%;display:block}
@keyframes tw{0%,100%{transform:translateX(0)}50%{transform:translateX(-15%)}}
.tube-w.full .tube-wave{animation:twf .8s ease-in-out infinite}
@keyframes twf{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(-18%) scaleY(1.4)}}
.tube-sh{position:absolute;top:0;left:2px;width:4px;height:100%;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent);border-radius:3px}
.tube-p{font-size:.58rem;font-weight:500;color:var(--t3)}
.tube-d{font-size:.6rem;color:var(--t3);font-weight:400}
.tube-d.now{color:var(--t1);font-weight:600}
.tube-col.now .tube-w{border-color:rgba(255,255,255,.12)}

/* 4. Sphere */
.sphere{display:flex;align-items:center;gap:18px;padding:18px 0}
.sph-w{position:relative;width:64px;height:64px;flex-shrink:0}
.sph-g{
  width:100%;height:100%;border-radius:50%;position:relative;overflow:hidden;
  background:rgba(255,255,255,.015);border:1px solid rgba(255,255,255,.05);
}
.sph-l{
  position:absolute;bottom:0;left:0;right:0;
  border-radius:0 0 50% 50%;
  transition:height 1.4s cubic-bezier(.4,0,.2,1);overflow:hidden;
}
.sph-l::before{
  content:'';position:absolute;top:-4px;left:-10%;width:120%;height:10px;
  background:rgba(255,255,255,.12);border-radius:50%;
  animation:sw 3s ease-in-out infinite;
}
@keyframes sw{0%,100%{transform:translateX(0) scaleY(1)}50%{transform:translateX(-8%) scaleY(1.5)}}
.sph-h{
  position:absolute;top:10px;left:14px;width:16px;height:10px;
  background:rgba(255,255,255,.08);border-radius:50%;
  transform:rotate(-30deg);filter:blur(2px);
}
.sph-info{flex:1}
.sph-date{font-size:.95rem;font-weight:600;margin-bottom:1px}
.sph-day{font-size:.72rem;color:var(--t3)}
.sph-pct{font-size:.75rem;font-weight:500;margin-top:2px;color:var(--t2)}

/* 5. Achievements */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:0}
.ach{
  background:var(--card);border:1px solid var(--border);
  border-radius:var(--rs);padding:14px 10px;text-align:center;
  position:relative;overflow:hidden;
}
.ach.lock{opacity:.25}
.ach.unlocked{border-color:rgba(255,255,255,.08)}
.ach-icon{font-size:1.5rem;margin-bottom:3px}
.ach-name{font-size:.68rem;font-weight:600;color:var(--t1);margin-bottom:1px}
.ach-desc{font-size:.58rem;color:var(--t3)}
.ach-flash{
  position:absolute;inset:0;background:rgba(184,169,201,.15);
  display:flex;align-items:center;justify-content:center;
  animation:af 1.8s ease-out forwards;pointer-events:none;
}
@keyframes af{0%{opacity:0}10%{opacity:1}100%{opacity:0}}
.ach-flash span{
  font-size:.75rem;font-weight:600;color:#fff;
  background:rgba(184,169,201,.85);padding:5px 12px;border-radius:16px;
  animation:pi .4s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes pi{0%{transform:scale(0)}100%{transform:scale(1)}}

/* 6. Archive */
.arch-list{display:flex;flex-direction:column;gap:8px}
.arch-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--rx)}
.arch-item:hover{background:var(--card)}
.arch-date{flex:1;font-size:.78rem;font-weight:500}
.arch-bar-w{width:70px;height:4px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden}
.arch-bar{height:100%;border-radius:2px;background:linear-gradient(135deg,#b8a9c9,#a9c4d9);transition:width 1s ease}
.arch-pct{font-size:.7rem;font-weight:600;color:var(--purple);min-width:32px;text-align:center}
.arch-empty{font-size:.75rem;color:var(--t3);text-align:center;padding:14px}

/* ====== VIEW MODE SWITCHER ====== */
.view-bar{
  display:flex;align-items:center;gap:4px;
  padding:4px;background:rgba(255,255,255,.02);
  border-radius:var(--rs);margin-bottom:14px;
}
.view-btn{
  flex:1;padding:7px 0;border:none;background:none;
  color:var(--t3);font-family:inherit;font-size:.72rem;
  font-weight:500;cursor:pointer;border-radius:var(--rx);
  display:flex;align-items:center;justify-content:center;gap:4px;
  transition:all .2s ease;
}
.view-btn:hover{color:var(--t2)}
.view-btn.on{background:rgba(255,255,255,.05);color:var(--t1)}
.view-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ====== LIST VIEW (default) ====== */
.planner{margin-bottom:12px}
.v-list .cat-card{border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.v-list .cat-hd{display:flex;align-items:center;padding:13px 14px;gap:10px;cursor:pointer;user-select:none}
.v-list .cat-em{font-size:1.05rem;flex-shrink:0}
.v-list .cat-info{flex:1}
.v-list .cat-name{font-size:.82rem;font-weight:600}
.v-list .cat-pr{display:flex;align-items:center;gap:8px;margin-top:4px}
.v-list .cat-bar-bg{flex:1;height:3px;background:rgba(255,255,255,.035);border-radius:2px;overflow:hidden}
.v-list .cat-bar-fg{height:100%;border-radius:2px;transition:width .5s ease}
.v-list .cat-pct{font-size:.62rem;font-weight:500;color:var(--t3);min-width:26px;text-align:left}
.v-list .cat-acts{display:flex;gap:2px;flex-shrink:0}
.v-list .cat-act{
  width:26px;height:26px;border:none;background:none;
  color:var(--t3);cursor:pointer;border-radius:var(--rx);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;
}
.v-list .cat-act:hover{color:var(--t2)}
.v-list .cat-tog{font-size:.8rem;color:var(--t3);flex-shrink:0;transition:transform .25s ease}
.v-list .cat-card.open .cat-tog{transform:rotate(180deg)}
.v-list .cat-body{max-height:0;overflow:hidden;transition:max-height .35s ease}
.v-list .cat-card.open .cat-body{max-height:2000px}
.v-list .cat-body-in{padding:0 14px 14px}

/* ====== GRID VIEW ====== */
.v-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;
}
.v-grid .g-card{
  border:1px solid var(--border);border-radius:var(--r);
  padding:16px 14px;cursor:pointer;
  transition:all .2s ease;position:relative;overflow:hidden;
}
.v-grid .g-card:hover{border-color:rgba(255,255,255,.1)}
.v-grid .g-card.open{grid-column:1/-1}
.v-grid .g-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.v-grid .g-em{font-size:1.3rem;flex-shrink:0}
.v-grid .g-name{font-size:.8rem;font-weight:600;flex:1}
.v-grid .g-pct{font-size:.7rem;font-weight:600;color:var(--t2)}
.v-grid .g-bar-bg{height:3px;background:rgba(255,255,255,.04);border-radius:2px;overflow:hidden;margin-bottom:6px}
.v-grid .g-bar-fg{height:100%;border-radius:2px;transition:width .5s ease}
.v-grid .g-tasks{display:none}
.v-grid .g-card.open .g-tasks{display:block;margin-top:10px;padding-top:10px;border-top:1px solid var(--border)}
.v-grid .g-card.open .g-expand-bar{margin-bottom:8px}
.v-grid .g-color-dot{
  position:absolute;top:8px;left:8px;width:6px;height:6px;border-radius:50%;opacity:.5;
}
.v-grid .g-acts{
  position:absolute;top:8px;left:20px;display:flex;gap:2px;opacity:0;transition:opacity .2s;
}
.v-grid .g-card:hover .g-acts{opacity:1}
.v-grid .g-act-btn{
  width:22px;height:22px;border:none;background:none;
  color:var(--t3);cursor:pointer;border-radius:4px;
  display:flex;align-items:center;justify-content:center;font-size:.7rem;
}
.v-grid .g-act-btn:hover{color:var(--t2)}

/* ====== CIRCLE VIEW ====== */
.v-circle{
  display:grid;grid-template-columns:repeat(3,1fr);gap:12px;
  justify-items:center;padding:4px 0;
}
.v-circle .ci-wrap{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  cursor:pointer;width:100%;
}
.v-circle .ci-ring{position:relative;width:72px;height:72px}
.v-circle .ci-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.v-circle .ci-ring-bg{fill:none;stroke:rgba(255,255,255,.04);stroke-width:4}
.v-circle .ci-ring-fg{fill:none;stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .8s ease}
.v-circle .ci-center{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
}
.v-circle .ci-name{font-size:.68rem;font-weight:500;color:var(--t2);text-align:center}
.v-circle .ci-pct{font-size:.6rem;color:var(--t3)}
.v-circle .ci-tasks{display:none}
.v-circle .ci-wrap.open .ci-tasks{
  display:block;grid-column:1/-1;width:100%;
  border:1px solid var(--border);border-radius:var(--r);
  padding:14px;margin-top:4px;
}
.v-circle .ci-acts{display:flex;gap:4px;justify-content:center;margin-top:6px}
.v-circle .ci-act-btn{
  padding:4px 10px;border:1px solid var(--border);background:none;
  color:var(--t3);cursor:pointer;border-radius:var(--rx);
  font-family:inherit;font-size:.68rem;
}
.v-circle .ci-act-btn:hover{color:var(--t2);border-color:rgba(255,255,255,.1)}

/* ====== COMPACT VIEW ====== */
.v-compact .cp-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border:1px solid var(--border);
  border-radius:var(--rx);margin-bottom:6px;
  cursor:pointer;transition:all .2s ease;
}
.v-compact .cp-item:hover{border-color:rgba(255,255,255,.1)}
.v-compact .cp-item.open{border-color:rgba(255,255,255,.08);border-radius:var(--r);margin-bottom:8px}
.v-compact .cp-em{font-size:.95rem;flex-shrink:0}
.v-compact .cp-info{flex:1;min-width:0}
.v-compact .cp-top{display:flex;align-items:center;gap:6px}
.v-compact .cp-name{font-size:.78rem;font-weight:600;flex:1}
.v-compact .cp-pct{font-size:.65rem;color:var(--t3);font-weight:500}
.v-compact .cp-bar-bg{height:2px;background:rgba(255,255,255,.03);border-radius:1px;overflow:hidden;margin-top:3px}
.v-compact .cp-bar-fg{height:100%;border-radius:1px;transition:width .5s ease}
.v-compact .cp-tasks{display:none}
.v-compact .cp-item.open .cp-tasks{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
.v-compact .cp-acts{display:flex;gap:2px;flex-shrink:0}
.v-compact .cp-act{
  width:24px;height:24px;border:none;background:none;
  color:var(--t3);cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:.75rem;
}
.v-compact .cp-act:hover{color:var(--t2)}

/* ====== SHARED TASK STYLES ====== */
.task-list{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.task-it{display:flex;align-items:center;gap:10px;padding:7px 0}
.task-chk{
  width:18px;height:18px;border:1.5px solid var(--t3);
  border-radius:50%;cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s ease;
}
.task-chk:hover{border-color:var(--green)}
.task-chk.on{border-color:var(--green);background:var(--green)}
.task-chk.on::after{
  content:'';width:4px;height:8px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;
  transform:rotate(45deg) translate(-1px,-1px);
}
.task-txt{flex:1;font-size:.8rem;color:var(--t1)}
.task-it.done .task-txt{text-decoration:line-through;color:var(--t3)}
.task-del{
  width:22px;height:22px;border:none;background:none;
  color:var(--t3);cursor:pointer;border-radius:4px;
  display:flex;align-items:center;justify-content:center;
  font-size:.7rem;opacity:0;transition:opacity .2s;
}
.task-it:hover .task-del{opacity:1}
.task-del:hover{color:var(--red)}
.task-inp-row{display:flex;gap:8px;align-items:center}
.task-inp{
  flex:1;background:rgba(255,255,255,.02);
  border:1px solid var(--border);border-radius:var(--rx);
  padding:8px 12px;color:var(--t1);font-family:inherit;
  font-size:.8rem;outline:none;direction:rtl;transition:border-color .2s;
}
.task-inp:focus{border-color:rgba(255,255,255,.12)}
.task-inp::placeholder{color:var(--t3)}
.task-add{
  width:34px;height:34px;border:none;background:var(--purple);
  color:#fff;border-radius:var(--rx);cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
}
.add-cat{
  width:100%;padding:11px;border:1px dashed rgba(255,255,255,.07);
  border-radius:var(--r);background:none;color:var(--t3);
  font-family:inherit;font-size:.78rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.add-cat:hover{border-color:rgba(255,255,255,.12);color:var(--t2)}

/* 9. Reset */
.reset-sec{margin-top:20px;padding-bottom:16px}
.reset-btn{
  width:100%;padding:11px;border:1px solid rgba(245,184,200,.1);
  border-radius:var(--rs);background:none;
  color:var(--t3);font-family:inherit;font-size:.75rem;
  font-weight:500;cursor:pointer;
}
.reset-btn:hover{color:var(--red);border-color:rgba(245,184,200,.25)}

/* Modal */
.modal-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-ov.show{opacity:1;pointer-events:all}
.modal-box{
  background:#15151e;border:1px solid var(--border);
  border-radius:var(--r);padding:24px 20px;max-width:400px;width:100%;
  text-align:center;transform:scale(.96);transition:transform .25s ease;
}
.modal-ov.show .modal-box{transform:scale(1)}
.modal-icon{font-size:1.8rem;margin-bottom:10px}
.modal-title{font-size:.88rem;font-weight:600;margin-bottom:6px}
.modal-desc{font-size:.75rem;color:var(--t2);margin-bottom:18px;line-height:1.8}
.modal-acts{display:flex;gap:8px}
.modal-btn{
  flex:1;padding:9px;border:none;border-radius:var(--rx);
  font-family:inherit;font-size:.8rem;font-weight:500;cursor:pointer;
}
.modal-btn.cancel{background:rgba(255,255,255,.04);color:var(--t2)}
.modal-btn.cancel:hover{background:rgba(255,255,255,.07)}
.modal-btn.danger{background:var(--red);color:#333}
.modal-btn.danger:hover{opacity:.85}
.modal-btn.confirm{background:var(--purple);color:#333}
.modal-btn.confirm:hover{opacity:.85}
.cm-inputs{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;text-align:right}
.cm-label{font-size:.75rem;color:var(--t2);margin-bottom:3px;font-weight:500}
.cm-input{
  background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--rx);padding:9px 12px;color:var(--t1);
  font-family:inherit;font-size:.8rem;outline:none;direction:rtl;
}
.cm-input:focus{border-color:rgba(255,255,255,.12)}
.emoji-row{display:flex;gap:5px;flex-wrap:wrap}
.emoji-opt{
  width:32px;height:32px;border:1px solid var(--border);
  border-radius:var(--rx);background:none;cursor:pointer;
  font-size:1rem;display:flex;align-items:center;justify-content:center;
}
.emoji-opt.sel{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.04)}
.cp-section{text-align:right}
.color-presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.color-preset{
  width:26px;height:26px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;transition:all .15s ease;position:relative;
}
.color-preset:hover{transform:scale(1.15)}
.color-preset.sel{border-color:rgba(255,255,255,.6);transform:scale(1.15)}
.color-preset.sel::after{
  content:'✓';position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;
  font-size:.6rem;color:#333;font-weight:700;
}
.cp-custom{
  display:flex;align-items:center;gap:10px;padding:10px;
  background:rgba(255,255,255,.02);border-radius:var(--rx);
}
.cp-picker-wrap{
  position:relative;width:40px;height:40px;border-radius:var(--rx);
  overflow:hidden;border:1px solid var(--border);flex-shrink:0;
}
.cp-picker-wrap input[type=color]{
  position:absolute;inset:-6px;width:calc(100% + 12px);height:calc(100% + 12px);
  border:none;cursor:pointer;padding:0;
  -webkit-appearance:none;appearance:none;
}
.cp-picker-wrap input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cp-picker-wrap input[type=color]::-webkit-color-swatch{border:none;border-radius:0}
.cp-hex-row{display:flex;align-items:center;gap:6px;flex:1}
.cp-hex-inp{
  flex:1;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:var(--rx);padding:7px 10px;color:var(--t1);
  font-family:monospace,'Vazirmatn',sans-serif;font-size:.8rem;
  outline:none;direction:ltr;text-align:center;letter-spacing:.05em;
}
.cp-hex-inp:focus{border-color:rgba(255,255,255,.15)}
.cp-hex-inp::placeholder{color:var(--t3);font-family:'Vazirmatn',sans-serif;direction:rtl;letter-spacing:0}
.cp-preview{
  width:40px;height:40px;border-radius:var(--rx);
  border:1px solid var(--border);flex-shrink:0;
  transition:background .2s ease;
}

/* Toast */
.toast-c{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:2000;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast{
  background:#1a1a26;border:1px solid var(--border);
  color:var(--t1);padding:9px 16px;border-radius:10px;
  font-family:inherit;font-size:.78rem;font-weight:500;
  animation:ti .35s ease forwards;pointer-events:all;white-space:nowrap;
}
@keyframes ti{0%{opacity:0;transform:translateY(-16px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.toast.out{animation:to .25s ease forwards}
@keyframes to{to{opacity:0;transform:translateY(-10px) scale(.95)}}

.conf-ov{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
.conf{position:absolute;border-radius:2px;animation:cf 2.5s ease-out forwards}
@keyframes cf{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg) scale(.3)}}

@media(max-width:400px){
  .wrap{padding:14px}
  .eff-ring{width:110px;height:110px}
  .eff-pct{font-size:1.8rem}
  .tube-w{width:24px;height:68px}
  .sph-w{width:52px;height:52px}
  .v-circle{grid-template-columns:repeat(2,1fr)}
  .v-circle .ci-ring{width:62px;height:62px}
}
</style>
</head>
<body>
<div class="toast-c" id="toastC"></div>
<div class="conf-ov" id="confOv"></div>

<div class="modal-ov" id="resetModal">
  <div class="modal-box">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">ریست کامل</div>
    <div class="modal-desc">تمام داده‌های این هفته پاک خواهد شد.<br>آیا مطمئن هستید؟</div>
    <div class="modal-acts">
      <button class="modal-btn cancel" onclick="closeM('resetModal')">انصراف</button>
      <button class="modal-btn danger" onclick="doReset()">بله، پاک شود</button>
    </div>
  </div>
</div>

<div class="modal-ov" id="catModal">
  <div class="modal-box">
    <div class="modal-icon" id="cmIcon">📁</div>
    <div class="modal-title" id="cmTitle">دسته جدید</div>
    <div class="cm-inputs">
      <div><div class="cm-label">نام دسته</div><input class="cm-input" id="cmName" placeholder="مثلاً: کار"></div>
      <div>
        <div class="cm-label">ایموجی</div>
        <div class="emoji-row" id="emojiPick"></div>
      </div>
      <div class="cp-section">
        <div class="cm-label">پالت رنگی</div>
        <div class="color-presets" id="colorPick"></div>
        <div class="cp-custom">
          <div class="cp-picker-wrap">
            <input type="color" id="nativeColorPicker" value="#b8a9c9">
          </div>
          <div class="cp-hex-row">
            <input class="cp-hex-inp" id="hexInput" type="text" maxlength="7" placeholder="کد هگز مثلاً #f5b8c8">
          </div>
          <div class="cp-preview" id="colorPreview" style="background:#b8a9c9"></div>
        </div>
      </div>
    </div>
    <div class="modal-acts">
      <button class="modal-btn cancel" onclick="closeM('catModal')">انصراف</button>
      <button class="modal-btn confirm" id="cmSave">ذخیره</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- 1 -->
  <div class="eff">
    <div class="eff-ring">
      <svg class="ring-svg" viewBox="0 0 160 160">
        <defs><linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#b8a9c9"/><stop offset="100%" stop-color="#a9c4d9"/></linearGradient></defs>
        <circle class="ring-bg" cx="80" cy="80" r="68"/>
        <circle class="ring-fg" id="ringFill" cx="80" cy="80" r="68" stroke-dasharray="427.26" stroke-dashoffset="427.26"/>
      </svg>
      <div class="eff-pct" id="effPct">۰</div>
    </div>
    <div class="eff-label">کارایی این هفته</div>
  </div>
  <div class="divider"></div>

  <!-- 2 -->
  <div class="focus" onclick="document.getElementById('focusInp').focus()">
    <span class="focus-e">🎯</span>
    <input class="focus-inp" id="focusInp" type="text" placeholder="تمرکز اصلی این هفته...">
  </div>
  <div class="divider"></div>

  <!-- 3 -->
  <div class="tubes">
    <div class="sec-title">پیشرفت روزهای هفته</div>
    <div class="tubes-row" id="tubesRow"></div>
  </div>
  <div class="divider"></div>

  <!-- 4 -->
  <div class="sphere">
    <div class="sph-w">
      <div class="sph-g">
        <div class="sph-l" id="sphLiq" style="height:0%"></div>
        <div class="sph-h"></div>
      </div>
    </div>
    <div class="sph-info">
      <div class="sph-date" id="sphDate"></div>
      <div class="sph-day" id="sphDay"></div>
      <div class="sph-pct" id="sphPct">پیشرفت امروز: ۰٪</div>
    </div>
  </div>
  <div class="divider"></div>

  <!-- 5 -->
  <div class="sec-title">دستاوردها</div>
  <div class="ach-grid" id="achGrid"></div>
  <div class="divider"></div>

  <!-- 6 -->
  <div class="sec-title">سوابق هفته‌های گذشته</div>
  <div class="arch-list" id="archList"></div>
  <div class="divider"></div>

  <!-- 7&8 -->
  <div class="sec-title">بخش‌ها</div>
  <div class="view-bar" id="viewBar"></div>
  <div id="planner"></div>
  <button class="add-cat" onclick="openCM()">+ دسته جدید</button>

  <!-- 9 -->
  <div class="reset-sec">
    <button class="reset-btn" onclick="openM('resetModal')">ریست کامل هفته جاری</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jalaali-js@1.2.7/dist/jalaali.min.js"></script>
<script>
function toFa(n){var p='۰۱۲۳۴۵۶۷۸۹';return String(n).replace(/[0-9]/g,function(d){return p[+d]})}
function esc(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function uid(){return'c'+Date.now()+'_'+Math.random().toString(36).substr(2,5)}

var DAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
var DS=['ش','ی','د','س','چ','پ','ج'];
var MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
var PDAYS=['یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه','شنبه'];
var TC=['#b8a9c9','#a9c4d9','#a9d4b8','#f5d5a0','#d4a9d9','#f5b8c8','#a9d4d4'];
var SK='wpV5',AK='wpAV5',CK='wpCV5',VK='wpViewV1';

/* Pastel palette */
var PASTELS=[
  '#b8a9c9','#a9c4d9','#a9d4b8','#c9e4a9',
  '#f5d5a0','#f5c8a0','#f5b8c8','#d4a9d9',
  '#a9d4d4','#c4d4a9','#d9bfa9','#a9b8d9',
  '#d4c9a9','#c9a9b8','#a9c9c4','#d9a9c9'
];

var DEFCATS=[
  {id:uid(),name:'کار',emoji:'💼',color:'#b8a9c9',tasks:[]},
  {id:uid(),name:'ورزش',emoji:'🏋️',color:'#a9d4b8',tasks:[]},
  {id:uid(),name:'مطالعه',emoji:'📚',color:'#a9c4d9',tasks:[]},
  {id:uid(),name:'شخصی',emoji:'🌱',color:'#d4a9d9',tasks:[]}
];
var ACHS=[
  {id:'gd',name:'روز طلایی',desc:'یک روز به ۱۰۰٪',icon:'🥇',chk:function(s){return s.tp.some(function(p){return p>=100})}},
  {id:'pw',name:'هفته کامل',desc:'کارایی بالای ۸۰٪',icon:'🌟',chk:function(s){return s.wp>=80}},
  {id:'s5',name:'ثبات قدم',desc:'۵ روز فعال پشت سر هم',icon:'🔥',chk:function(s){var c=0,m=0;s.tp.forEach(function(p){p>0?c++:(c=0);if(c>m)m=c});return m>=5}},
  {id:'ft',name:'شروع خوب',desc:'اولین تسک تیک‌خورده',icon:'✨',chk:function(s){return s.td>=1}}
];

/* View modes */
var VIEWS=[
  {id:'list',label:'لیست',icon:'<svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>'},
  {id:'grid',label:'شبکه',icon:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>'},
  {id:'circle',label:'دایره',icon:'<svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="4"/><circle cx="17" cy="7" r="4"/><circle cx="7" cy="17" r="4"/><circle cx="17" cy="17" r="4"/></svg>'},
  {id:'compact',label:'فشرده',icon:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="16" width="18" height="4" rx="2"/></svg>'}
];
var viewMode='list';

function todayJ(){var d=new Date();return jalaali.toJalaali(d.getFullYear(),d.getMonth()+1,d.getDate())}
function dayIdx(){return(new Date().getDay()+1)%7}
function weekKey(){var n=new Date(),o=(n.getDay()+1)%7,s=new Date(n);s.setDate(s.getDate()-o);var j=jalaali.toJalaali(s.getFullYear(),s.getMonth()+1,s.getDate());return j.jy+'-'+j.jm+'-'+j.jd}
function jDayName(jy,jm,jd){var g=jalaali.toGregorian(jy,jm,jd),d=new Date(g.gy,g.gm-1,g.gd);return PDAYS[d.getDay()]}

var state,achs={};
function fresh(wk){return{wk:wk,focus:'',cats:JSON.parse(JSON.stringify(DEFCATS)),tp:[0,0,0,0,0,0,0]}}
function load(){
  try{viewMode=localStorage.getItem(VK)||'list'}catch(e){viewMode='list'}
  try{var r=localStorage.getItem(SK),wk=weekKey();
    if(r){var p=JSON.parse(r);if(p.wk===wk){state=p}else{archW(p);state=fresh(wk)}}
    else state=fresh(wk);
  }catch(e){state=fresh(weekKey())}
  try{var a=localStorage.getItem(CK);if(a)achs=JSON.parse(a)}catch(e){}
}
function archW(old){
  try{var a=JSON.parse(localStorage.getItem(AK)||'[]');
    a.unshift({wk:old.wk,d:old.wk,pct:wkPct(old)});
    if(a.length>12)a=a.slice(0,12);localStorage.setItem(AK,JSON.stringify(a));
  }catch(e){}
}
function save(){try{localStorage.setItem(SK,JSON.stringify(state))}catch(e){}}
function saveA(){try{localStorage.setItem(CK,JSON.stringify(achs))}catch(e){}}
function saveView(){try{localStorage.setItem(VK,viewMode)}catch(e){}}

function catPct(c){if(!c.tasks||!c.tasks.length)return 0;return Math.round(c.tasks.filter(function(t){return t.done}).length/c.tasks.length*100)}
function wkPct(s){s=s||state;var tt=0,td=0;(s.cats||[]).forEach(function(c){if(c.tasks){tt+=c.tasks.length;td+=c.tasks.filter(function(t){return t.done}).length}});return tt?Math.round(td/tt*100):0}
function stats(){var tt=0,td=0;(state.cats||[]).forEach(function(c){if(c.tasks){tt+=c.tasks.length;td+=c.tasks.filter(function(t){return t.done}).length}});return{tt:tt,td:td,wp:wkPct(),tp:(state.tp||[]).slice()}}

var dispPct=0;
function rEff(pct){
  var c=2*Math.PI*68,o=c-(pct/100)*c;
  document.getElementById('ringFill').style.strokeDashoffset=o;
  aCnt(document.getElementById('effPct'),dispPct,pct,1200);dispPct=pct;
}
function aCnt(el,f,t,d){var s=null;function step(ts){if(!s)s=ts;var p=Math.min((ts-s)/d,1),e=1-Math.pow(1-p,3);el.textContent=toFa(Math.round(f+(t-f)*e));if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}

function rTubes(){
  var row=document.getElementById('tubesRow'),ti=dayIdx();row.innerHTML='';
  for(var i=0;i<7;i++){
    var pct=state.tp[i]||0,isT=i===ti,col=TC[i],full=pct>=100;
    var c=document.createElement('div');c.className='tube-col'+(isT?' now':'');
    var w=document.createElement('div');w.className='tube-w'+(full?' full':'');
    var l=document.createElement('div');l.className='tube-liq';l.style.height='0%';l.style.background=col;
    var wv=document.createElement('div');wv.className='tube-wave';
    wv.innerHTML='<svg viewBox="0 0 120 14" preserveAspectRatio="none"><path d="M0,7 Q15,0 30,7 T60,7 T90,7 T120,7 V14 H0 Z" fill="'+col+'" opacity="0.5"/></svg>';
    var sh=document.createElement('div');sh.className='tube-sh';
    l.appendChild(wv);l.appendChild(sh);w.appendChild(l);
    var pe=document.createElement('div');pe.className='tube-p';pe.textContent=toFa(pct)+'٪';
    var de=document.createElement('div');de.className='tube-d'+(isT?' now':'');de.textContent=DS[i];
    c.appendChild(w);c.appendChild(pe);c.appendChild(de);row.appendChild(c);
    (function(le,p){setTimeout(function(){le.style.height=Math.min(p,100)+'%'},80+i*60)})(l,pct);
  }
}

function rSphere(){
  var j=todayJ(),ds=toFa(j.jd)+' '+MONTHS[j.jm-1]+' '+toFa(j.jy),
      dn=jDayName(j.jy,j.jm,j.jd),ti=dayIdx(),tp=state.tp[ti]||0;
  document.getElementById('sphDate').textContent=ds;
  document.getElementById('sphDay').textContent=dn;
  document.getElementById('sphPct').textContent='پیشرفت امروز: '+toFa(tp)+'٪';
  var l=document.getElementById('sphLiq');l.style.background='linear-gradient(to top,#b8a9c9,#a9c4d9)';
  setTimeout(function(){l.style.height=tp+'%'},200);
}

function rAch(s,anim){
  var g=document.getElementById('achGrid');g.innerHTML='';
  ACHS.forEach(function(d){
    var u=achs[d.id],ju=false;
    if(!u&&d.chk(s)){achs[d.id]=true;saveA();u=true;ju=true;if(anim){toast('🎉 «'+d.name+'» باز شد!');confetti()}}
    var b=document.createElement('div');b.className='ach '+(u?'unlocked':'lock');
    var h='<div class="ach-icon">'+d.icon+'</div><div class="ach-name">'+d.name+'</div><div class="ach-desc">'+d.desc+'</div>';
    if(ju&&anim)h+='<div class="ach-flash"><span>🎉 باز شد!</span></div>';
    b.innerHTML=h;g.appendChild(b);
  });
}

function rArch(){
  var l=document.getElementById('archList');
  try{var a=JSON.parse(localStorage.getItem(AK)||'[]');
    if(!a.length){l.innerHTML='<div class="arch-empty">هنوز هفته‌ای آرشیو نشده</div>';return}
    l.innerHTML='';a.forEach(function(ar){
      var it=document.createElement('div');it.className='arch-item';
      it.innerHTML='<div class="arch-date">'+toFa(ar.d)+'</div><div class="arch-bar-w"><div class="arch-bar" style="width:'+Math.min(ar.pct,100)+'%"></div></div><div class="arch-pct">'+toFa(ar.pct)+'٪</div>';
      l.appendChild(it);
    });
  }catch(e){l.innerHTML='<div class="arch-empty">هنوز هفته‌ای آرشیو نشده</div>'}
}

/* ====== VIEW BAR ====== */
function rViewBar(){
  var bar=document.getElementById('viewBar');bar.innerHTML='';
  VIEWS.forEach(function(v){
    var b=document.createElement('button');
    b.className='view-btn'+(viewMode===v.id?' on':'');
    b.innerHTML=v.icon+' '+v.label;
    b.onclick=function(){viewMode=v.id;saveView();rViewBar();rPlanner()};
    bar.appendChild(b);
  });
}

/* ====== TASK HTML (shared) ====== */
function taskHTML(cat){
  var h='<div class="task-list">';
  (cat.tasks||[]).forEach(function(t,i){
    h+='<div class="task-it'+(t.done?' done':'')+'">'+
      '<div class="task-chk'+(t.done?' on':'')+'" onclick="togTask(\''+cat.id+'\','+i+')"></div>'+
      '<span class="task-txt"'+(t.done?' style="text-decoration:line-through;color:var(--t3)"':'')+'>'+esc(t.text)+'</span>'+
      '<button class="task-del" onclick="delTask(\''+cat.id+'\','+i+')">✕</button></div>';
  });
  h+='</div><div class="task-inp-row"><input class="task-inp" placeholder="تسک جدید..." onkeydown="if(event.key===\'Enter\')addTask(\''+cat.id+'\',this)"><button class="task-add" onclick="addTask(\''+cat.id+'\',this.parentElement.querySelector(\'.task-inp\'))">+</button></div>';
  return h;
}

/* ====== PLANNER RENDERERS ====== */
var openId=null;

function rPlanner(){
  var sec=document.getElementById('planner');
  if(viewMode==='list') rList(sec);
  else if(viewMode==='grid') rGrid(sec);
  else if(viewMode==='circle') rCircle(sec);
  else rCompact(sec);
}

/* --- List --- */
function rList(sec){
  sec.innerHTML='';sec.className='planner v-list';
  (state.cats||[]).forEach(function(cat){
    var pct=catPct(cat),isO=openId===cat.id;
    var cd=document.createElement('div');cd.className='cat-card'+(isO?' open':'');cd.id='c-'+cat.id;
    cd.innerHTML=
      '<div class="cat-hd"><span class="cat-em">'+cat.emoji+'</span>'+
      '<div class="cat-info"><div class="cat-name">'+cat.name+'</div>'+
      '<div class="cat-pr"><div class="cat-bar-bg"><div class="cat-bar-fg" style="width:'+pct+'%;background:'+cat.color+'"></div></div>'+
      '<span class="cat-pct">'+toFa(pct)+'٪</span></div></div>'+
      '<div class="cat-acts"><button class="cat-act" onclick="event.stopPropagation();openCM(\''+cat.id+'\')">✏</button>'+
      '<button class="cat-act" onclick="event.stopPropagation();delCat(\''+cat.id+'\')">✕</button></div>'+
      '<span class="cat-tog">▼</span></div>'+
      '<div class="cat-body"><div class="cat-body-in">'+(isO?taskHTML(cat):'')+'</div></div>';
    cd.querySelector('.cat-hd').onclick=function(){openId=openId===cat.id?null:cat.id;rPlanner()};
    sec.appendChild(cd);
  });
}

/* --- Grid --- */
function rGrid(sec){
  sec.innerHTML='';sec.className='planner v-grid';
  (state.cats||[]).forEach(function(cat){
    var pct=catPct(cat),isO=openId===cat.id;
    var cd=document.createElement('div');cd.className='g-card'+(isO?' open':'');
    cd.innerHTML=
      '<div class="g-color-dot" style="background:'+cat.color+'"></div>'+
      '<div class="g-acts"><button class="g-act-btn" onclick="event.stopPropagation();openCM(\''+cat.id+'\')">✏</button>'+
      '<button class="g-act-btn" onclick="event.stopPropagation();delCat(\''+cat.id+'\')">✕</button></div>'+
      '<div class="g-top"><span class="g-em">'+cat.emoji+'</span><span class="g-name">'+cat.name+'</span><span class="g-pct">'+toFa(pct)+'٪</span></div>'+
      '<div class="g-bar-bg g-expand-bar"><div class="g-bar-fg" style="width:'+pct+'%;background:'+cat.color+'"></div></div>'+
      '<div class="g-tasks">'+(isO?taskHTML(cat):'')+'</div>';
    cd.onclick=function(e){if(e.target.closest('.g-act-btn')||e.target.closest('.task-chk')||e.target.closest('.task-del')||e.target.closest('.task-add')||e.target.tagName==='INPUT')return;openId=openId===cat.id?null:cat.id;rPlanner()};
    sec.appendChild(cd);
  });
}

/* --- Circle --- */
function rCircle(sec){
  sec.innerHTML='';sec.className='planner v-circle';
  var R=30,circ=2*Math.PI*R;
  (state.cats||[]).forEach(function(cat){
    var pct=catPct(cat),isO=openId===cat.id;
    var off=circ-(pct/100)*circ;
    var w=document.createElement('div');w.className='ci-wrap'+(isO?' open':'');
    w.innerHTML=
      '<div class="ci-ring"><svg viewBox="0 0 72 72"><circle class="ci-ring-bg" cx="36" cy="36" r="'+R+'"/>'+
      '<circle class="ci-ring-fg" cx="36" cy="36" r="'+R+'" stroke="'+cat.color+'" stroke-dasharray="'+circ+'" stroke-dashoffset="'+off+'"/></svg>'+
      '<div class="ci-center">'+cat.emoji+'</div></div>'+
      '<div class="ci-name">'+cat.name+'</div>'+
      '<div class="ci-pct">'+toFa(pct)+'٪</div>'+
      '<div class="ci-tasks"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:.78rem;font-weight:600">'+cat.emoji+' '+cat.name+'</span>'+
      '<div style="display:flex;gap:4px"><button class="ci-act-btn" onclick="event.stopPropagation();openCM(\''+cat.id+'\')">ویرایش</button>'+
      '<button class="ci-act-btn" onclick="event.stopPropagation();delCat(\''+cat.id+'\')">حذف</button></div></div>'+
      (isO?taskHTML(cat):'')+'</div>';
    w.onclick=function(e){if(e.target.closest('.ci-act-btn')||e.target.closest('.task-chk')||e.target.closest('.task-del')||e.target.closest('.task-add')||e.target.tagName==='INPUT')return;openId=openId===cat.id?null:cat.id;rPlanner()};
    sec.appendChild(w);
  });
}

/* --- Compact --- */
function rCompact(sec){
  sec.innerHTML='';sec.className='planner v-compact';
  (state.cats||[]).forEach(function(cat){
    var pct=catPct(cat),isO=openId===cat.id;
    var cd=document.createElement('div');cd.className='cp-item'+(isO?' open':'');
    cd.innerHTML=
      '<span class="cp-em">'+cat.emoji+'</span>'+
      '<div class="cp-info"><div class="cp-top"><span class="cp-name">'+cat.name+'</span><span class="cp-pct">'+toFa(pct)+'٪</span></div>'+
      '<div class="cp-bar-bg"><div class="cp-bar-fg" style="width:'+pct+'%;background:'+cat.color+'"></div></div></div>'+
      '<div class="cp-acts"><button class="cp-act" onclick="event.stopPropagation();openCM(\''+cat.id+'\')">✏</button>'+
      '<button class="cp-act" onclick="event.stopPropagation();delCat(\''+cat.id+'\')">✕</button></div>'+
      '<div class="cp-tasks">'+(isO?taskHTML(cat):'')+'</div>';
    cd.onclick=function(e){if(e.target.closest('.cp-act')||e.target.closest('.task-chk')||e.target.closest('.task-del')||e.target.closest('.task-add')||e.target.tagName==='INPUT')return;openId=openId===cat.id?null:cat.id;rPlanner()};
    sec.appendChild(cd);
  });
}

/* ====== TASK ACTIONS ====== */
function addTask(cid,inp){
  var txt=inp.value.trim();if(!txt)return;
  var cat=state.cats.find(function(c){return c.id===cid});if(!cat)return;
  if(!cat.tasks)cat.tasks=[];cat.tasks.push({text:txt,done:false});inp.value='';
  recalc();save();upAll(true);rPlanner();
  setTimeout(function(){var t=document.querySelector('#planner .task-inp');if(t)t.focus()},50);
}
function togTask(cid,idx){var cat=state.cats.find(function(c){return c.id===cid});if(!cat||!cat.tasks[idx])return;cat.tasks[idx].done=!cat.tasks[idx].done;recalc();save();upAll(true);rPlanner()}
function delTask(cid,idx){var cat=state.cats.find(function(c){return c.id===cid});if(!cat||!cat.tasks[idx])return;cat.tasks.splice(idx,1);recalc();save();upAll(true);rPlanner()}
function delCat(cid){state.cats=state.cats.filter(function(c){return c.id!==cid});if(openId===cid)openId=null;recalc();save();upAll(true);rPlanner()}
function recalc(){state.tp[dayIdx()]=wkPct()}

/* ====== CATEGORY MODAL ====== */
var EMOJIS=['💼','🏋️','📚','🌱','🎨','🎵','💰','❤️','🏠','🎮','✈️','🎯','📱','🍳','🧘','💻'];
var selE='📁',selC='#b8a9c9',editId=null;

function initCM(){
  var ep=document.getElementById('emojiPick');ep.innerHTML='';
  EMOJIS.forEach(function(e){var b=document.createElement('button');b.className='emoji-opt';b.textContent=e;b.onclick=function(){ep.querySelectorAll('.emoji-opt').forEach(function(x){x.classList.remove('sel')});b.classList.add('sel');selE=e};ep.appendChild(b)});
  var cp=document.getElementById('colorPick');cp.innerHTML='';
  PASTELS.forEach(function(c){var b=document.createElement('button');b.className='color-preset'+(c===selC?' sel':'');b.style.background=c;b.onclick=function(){setSelColor(c)};cp.appendChild(b)});
  var np=document.getElementById('nativeColorPicker');
  np.value=selC;
  np.oninput=function(){setSelColor(this.value)};
  var hi=document.getElementById('hexInput');
  hi.value=selC;
  hi.oninput=function(){var v=this.value.trim();if(/^#[0-9a-fA-F]{6}$/.test(v)){setSelColor(v)}};
  hi.onblur=function(){this.value=selC};
  document.getElementById('colorPreview').style.background=selC;
}
function openCM(cid){
  editId=cid||null;var t=document.getElementById('cmTitle'),n=document.getElementById('cmName'),ic=document.getElementById('cmIcon');
  if(cid){t.textContent='ویرایش دسته';ic.textContent='✏️';var cat=state.cats.find(function(c){return c.id===cid});if(cat){n.value=cat.name;selE=cat.emoji;selC=cat.color}}
  else{t.textContent='دسته جدید';ic.textContent='📁';n.value='';selE='📁';selC='#b8a9c9'}
  setTimeout(function(){
    document.querySelectorAll('#emojiPick .emoji-opt').forEach(function(b){b.classList.toggle('sel',b.textContent===selE)});
    document.querySelectorAll('#colorPick .color-preset').forEach(function(b){b.classList.toggle('sel',rgb2h(b.style.background)===selC.toLowerCase())});
    document.getElementById('nativeColorPicker').value=selC;
    document.getElementById('hexInput').value=selC;
    document.getElementById('colorPreview').style.background=selC;
  },50);openM('catModal');setTimeout(function(){n.focus()},300);
}
function rgb2h(r){if(!r)return'';if(r[0]==='#')return r.toLowerCase();var m=r.match(/\d+/g);return m?'#'+[m[0],m[1],m[2]].map(function(x){return(+x).toString(16).padStart(2,'0')}).join(''):r}
function setSelColor(c){
  selC=c.toLowerCase();
  document.querySelectorAll('#colorPick .color-preset').forEach(function(b){b.classList.toggle('sel',rgb2h(b.style.background)===selC)});
  document.getElementById('nativeColorPicker').value=selC;
  document.getElementById('hexInput').value=selC;
  document.getElementById('colorPreview').style.background=selC;
}
function saveCM(){
  var n=document.getElementById('cmName').value.trim();if(!n){toast('⚠️ نام دسته را وارد کنید');return}
  if(editId){var cat=state.cats.find(function(c){return c.id===editId});if(cat){cat.name=n;cat.emoji=selE;cat.color=selC}}
  else state.cats.push({id:uid(),name:n,emoji:selE,color:selC,tasks:[]});
  save();closeM('catModal');upAll(true);rPlanner();
}

function openM(id){document.getElementById(id).classList.add('show')}
function closeM(id){document.getElementById(id).classList.remove('show')}
function doReset(){archW(state);state=fresh(weekKey());achs={};save();saveA();closeM('resetModal');upAll(false);rPlanner();initF();toast('✅ داده‌ها پاک شد')}

function toast(m){var c=document.getElementById('toastC'),t=document.createElement('div');t.className='toast';t.textContent=m;c.appendChild(t);setTimeout(function(){t.classList.add('out')},2500);setTimeout(function(){t.remove()},3000)}
function confetti(){var ov=document.getElementById('confOv'),cols=['#b8a9c9','#a9c4d9','#a9d4b8','#f5d5a0','#d4a9d9','#f5b8c8','#a9d4d4','#fff'];for(var i=0;i<30;i++){var c=document.createElement('div');c.className='conf';c.style.left=Math.random()*100+'%';c.style.top='-10px';c.style.background=cols[Math.floor(Math.random()*cols.length)];c.style.animationDelay=Math.random()*.6+'s';c.style.animationDuration=(2+Math.random()*1.5)+'s';c.style.width=(4+Math.random()*6)+'px';c.style.height=(4+Math.random()*6)+'px';c.style.borderRadius=Math.random()>.5?'50%':'2px';ov.appendChild(c);(function(e){setTimeout(function(){e.remove()},4000)})(c)}}

function initF(){var i=document.getElementById('focusInp');i.value=state.focus||'';i.onblur=function(){state.focus=i.value;save()}}
function upAll(a){var s=stats();rEff(s.wp);rTubes();rSphere();rAch(s,a!==false);rArch()}

function init(){
  load();initF();initCM();rViewBar();
  document.getElementById('cmSave').onclick=saveCM;
  document.querySelectorAll('.modal-ov').forEach(function(m){m.addEventListener('click',function(e){if(e.target===m)closeM(m.id)})});
  upAll(true);rPlanner();
}
setInterval(function(){var w=weekKey();if(state.wk!==w){archW(state);state=fresh(w);save();upAll(false);rPlanner();initF();toast('📅 هفته جدید شروع شد!')}},60000);
init();
</script>
</body>
